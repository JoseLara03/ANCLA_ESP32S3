#
# Ranging-path diagnostics. Applied on top of prj.conf:
#   west build -b ancla_esp32s3/esp32s3/procpu --pristine -d build_dbg -- "-DEXTRA_CONF_FILE=debug.conf"
#
# (PowerShell splits an unquoted -DEXTRA_CONF_FILE=debug.conf into two
# arguments at the dot and the build fails looking for a file named "debug".)
#
# Produces the production anchor with the DISCOVERY/WAVE responder verdicts, the
# SLAVE loop's RX heartbeat and the per-beacon guard state compiled in. Same
# frames, same timing constants, same gates -- a debug board and a production
# board interoperate normally. Do not deploy it: the per-frame console traffic
# and the heartbeat's extra SPI read both cost SLAVE-loop time.

CONFIG_ANCLA_RANGING_DEBUG=y

# Deliberately NOT raising CONFIG_LOG_DEFAULT_LEVEL. It is only the level a
# module gets when it registers WITHOUT one; the ranging modules register
# explicitly (through ANCLA_LOG_LEVEL, which the flag above turns to DBG) and
# an explicit level is capped by CONFIG_LOG_MAX_LEVEL alone, already 4 here.
# Raising the default would change nothing for those modules and would promote
# the whole WiFi/net/mbedTLS stack to DBG, burying the lines being chased.
#
# CONFIG_LOG_RUNTIME_FILTERING is already on, so if a module still floods the
# console it can be quietened live: `log disable <module>` / `log enable inf
# <module>`. That only ever narrows what a build compiled in -- it cannot
# recover the DBG lines a production image left out, which is the whole reason
# this overlay exists.

# Deferred logging (Zephyr's default here) formats into this pool and DROPS
# records when it fills. The default 1024 B is far too small once every received
# frame emits a verdict line: the dropped records would be exactly the burst
# around the event being chased, and a dropped line is indistinguishable from a
# response that never happened -- the precise conflation this image exists to
# break.
CONFIG_LOG_BUFFER_SIZE=8192

# Timestamp every line past the 32-bit (~49 day) rollover so the three anchors'
# captures can be aligned against each other and against the tag's output.
CONFIG_LOG_TIMESTAMP_64BIT=y

# ---- Synchronous logging, and why this image needs it -------------------
#
# Deferred logging cannot report a fault that starves the scheduler, and that is
# exactly the class of fault this image is now used to chase. The log-processing
# thread runs at K_LOWEST_APPLICATION_THREAD_PRIO -- PREEMPTIBLE -- while the
# GATEWAY loop runs at K_PRIO_COOP(0) and dwt_isr() on the system workqueue at
# -1. Whenever those two stop going idle, nothing preemptible is scheduled: the
# queued records are never drained, CONFIG_LOG_MODE_OVERFLOW then OVERWRITES
# them, and the console shows silence rather than the burst that explains it.
# The last line before a freeze is precisely the line that gets destroyed.
#
# Immediate mode formats and writes from the CALLING thread, so every line
# reaches the console before the code that emitted it continues -- the last line
# printed is the last line executed.
#
# The cost is real and must not be mistaken for the bug: a synchronous write
# from the K_PRIO_COOP(0) loop takes milliseconds, so this image WILL miss
# beacons and log "beacon started but TXFRS never completed" under load. That is
# the instrument, not the fault. Never deploy it, and never compare its beacon
# timing against production's.
CONFIG_LOG_MODE_IMMEDIATE=y
