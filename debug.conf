#
# Ranging-path diagnostics. Applied on top of prj.conf:
#   west build -b ancla_esp32s3/esp32s3/procpu --pristine -d build_dbg -- "-DEXTRA_CONF_FILE=debug.conf"
#
# (PowerShell splits an unquoted -DEXTRA_CONF_FILE=debug.conf into two
# arguments at the dot and the build fails looking for a file named "debug".)
#
# Produces the production anchor with the DISCOVERY/WAVE responder verdicts, the
# SLAVE loop's RX heartbeat and the per-beacon guard state compiled in. Same
# frames, same timing constants, same gates -- a debug board and a production
# board interoperate normally. Do not deploy it: the per-frame console traffic
# and the heartbeat's extra SPI read both cost SLAVE-loop time.

CONFIG_ANCLA_RANGING_DEBUG=y

# Deliberately NOT raising CONFIG_LOG_DEFAULT_LEVEL. It is only the level a
# module gets when it registers WITHOUT one; the ranging modules register
# explicitly (through ANCLA_LOG_LEVEL, which the flag above turns to DBG) and
# an explicit level is capped by CONFIG_LOG_MAX_LEVEL alone, already 4 here.
# Raising the default would change nothing for those modules and would promote
# the whole WiFi/net/mbedTLS stack to DBG, burying the lines being chased.
#
# CONFIG_LOG_RUNTIME_FILTERING is already on, so if a module still floods the
# console it can be quietened live: `log disable <module>` / `log enable inf
# <module>`. That only ever narrows what a build compiled in -- it cannot
# recover the DBG lines a production image left out, which is the whole reason
# this overlay exists.

# Deferred logging (Zephyr's default here) formats into this pool and DROPS
# records when it fills. The default 1024 B is far too small once every received
# frame emits a verdict line: the dropped records would be exactly the burst
# around the event being chased, and a dropped line is indistinguishable from a
# response that never happened -- the precise conflation this image exists to
# break.
CONFIG_LOG_BUFFER_SIZE=8192

# Timestamp every line past the 32-bit (~49 day) rollover so the three anchors'
# captures can be aligned against each other and against the tag's output.
CONFIG_LOG_TIMESTAMP_64BIT=y

# ---- CONFIG_LOG_MODE_IMMEDIATE was tried here and is WRONG on this build ----
#
# Do not re-add it. Tried 2026-08-26 to get the last line out before a freeze,
# on the reasoning that deferred logging cannot report a fault that starves the
# scheduler (true: the log thread runs at K_LOWEST_APPLICATION_THREAD_PRIO,
# preemptible, and CONFIG_LOG_MODE_OVERFLOW then overwrites the queued records).
# It failed twice over on hardware, both times worse than the problem:
#
# 1. It destroyed the thing under measurement. A synchronous console write from
#    the K_PRIO_COOP(0) loop costs milliseconds against a 5 ms
#    BEACON_ARM_MARGIN_UUS, so EVERY delayed beacon missed its slot -- observed
#    as "beacon missed its slot" on every superframe, with the re-base then
#    dragging the cadence to ~210.7 ms against a 200 ms T_SUPERFRAME_UUS. An
#    image whose own instrument breaks the timing cannot investigate timing.
#
# 2. It crashed the board ~1.8 s into boot, right as WiFi associated:
#    EXCCAUSE 20 (inst fetch prohibited), PC 0x640, current thread `idle`.
#    A garbage PC in the idle thread is a corrupted stack, and the likely
#    mechanism is immediate mode's inline cbprintf formatting running in a
#    context borrowing the 1024-byte CONFIG_IDLE_STACK_SIZE (an ISR taken while
#    idle, with the WiFi blob logging heavily at that moment). Deferred mode
#    only memcpys into a pool from the caller, which is why production never
#    sees this.
#
# The freeze this was reaching for is instead served from the gateway loop
# itself: the stall watchdog in uwb_gateway.c enqueues its report and then
# k_msleep(1)s, which is what lets the preemptible log thread drain it. Deferred
# logging plus one deliberate sleep beats synchronous logging everywhere here.

# Software stack sentinel, because Xtensa has no ARCH_HAS_STACK_PROTECTION here.
# Checked on every context switch: turns the next garbage-PC crash into a named
# thread and a clear overflow message instead of an address to guess at. Costs a
# word per stack and a compare per switch -- worth it in a diagnostic image,
# which is why it is here and not in prj.conf.
CONFIG_STACK_SENTINEL=y
