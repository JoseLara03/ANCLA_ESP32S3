# EXTRA_CONF_FILE overlay for early ancla_esp32s3 boards whose IRQ line has
# no hardware pull-down resistor. Turns on the ESP32's internal pull-down on
# the DW3220 IRQ pin (modules/dw3000-decadriver/platform/dw3000_hw.c) so the
# GPIO_INT_EDGE_RISING trigger stops missing edges on a floating pin. See
# CLAUDE.md's IRQ-float hard-won fact for the failure this fixes: rx_sem
# never given, gateway loop stalls every superframe, no beacon ever sent.
#
# Stacks with cal.conf/debug.conf -- combine with a second -DEXTRA_CONF_FILE
# entry if a board needs both.
CONFIG_ANCLA_OLD_BOARD=y
