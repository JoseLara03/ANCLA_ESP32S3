#
# TEMPORARY overlay for Task 7's filter-trace investigation. Applied on top of
# prj.conf:
#   west build -b ancla_esp32s3/esp32s3/procpu --pristine -d build_trace -- "-DEXTRA_CONF_FILE=trace.conf"
#
# (Quote the -D, or PowerShell splits it at the dot and the build fails looking
# for a file named "trace".)
#
# ---- Why this is NOT debug.conf -------------------------------------------
#
# debug.conf was the obvious thing to reach for and it is the wrong tool here,
# because its own instruments fight this measurement. It compiles in
# CONFIG_ANCLA_RANGING_DEBUG, whose per-superframe `gw_sf` heartbeat is FIVE
# console lines a second, plus CONFIG_THREAD_ANALYZER_AUTO every 5 s. The
# console on this board already delivers only ~20 % of records at 2 fixes/s
# (1424 fixes counted against 291 delivered, measured 2026-09-03, with no
# Zephyr drop report because the loss is below its accounting) -- so adding a
# steady 5 lines/s takes the `pos_sink` fix lines and the 128-line `blink
# trace` dump down with it.
#
# A first attempt at the Task 7 capture was taken with debug.conf and came
# back with 71 fix lines over 463 s and no usable trace. That is what this
# file exists to avoid.
#
# So: the trace ring and NOTHING else. Same production timing, same frames,
# same gates, and a console that is quiet except for the fixes and the dump.

CONFIG_ANCLA_TDOA_TRACE=y

# The dump is ~128 shell_print lines. shell_print is synchronous and
# flow-controlled, so it does not go through the log pool and cannot be
# dropped by it -- but the FIX lines do, and they are what the dump has to be
# correlated against. 8192 B buys enough headroom that a burst of fixes during
# a runaway is not silently thinned while it is happening.
CONFIG_LOG_BUFFER_SIZE=8192

# Past the 32-bit (~49 day) rollover, so a capture can be aligned against the
# anchors' and the tag's own logs. Same reason debug.conf sets it.
CONFIG_LOG_TIMESTAMP_64BIT=y

# DELETE THIS FILE with the rest of CONFIG_ANCLA_TDOA_TRACE once the runaway
# is explained. `git grep ANCLA_TDOA_TRACE` finds every line of the feature.
