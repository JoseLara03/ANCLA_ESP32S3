CONFIG_GPIO=y
CONFIG_SPI=y

# Qorvo/Decawave DW3220 (DW3000 family) via the vendored decadriver module.
CONFIG_DW3000=y
CONFIG_DW3000_CHIP_DW3000=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Persistent per-anchor configuration in NVS on storage_partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# %f in the config banner and in `anchor show`.
CONFIG_CBPRINTF_FP_SUPPORT=y

# The main thread runs the mode loop.
CONFIG_MAIN_STACK_SIZE=4096

# `anchor` command tree over the native USB-JTAG console.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="uwb:~$ "
CONFIG_REBOOT=y

# WiFi + MQTT uplink (GATEWAY mode only; see src/net_uplink.c).
# CONFIG_WIFI_ESP32 enables itself from the board's &wifi node.
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_MQTT_LIB=y

# NOT OPTIONAL, and the reason it was missing cost a real diagnosis: this
# Kconfig has no default and defaults to n (mqtt_internal.h's MQTT_CLEAN_SESSION
# macro), so every board was running a PERSISTENT broker session. Combined with
# the client-id-collision bug (uwb_config_short_addr() returning the same
# address for a fresh gateway and anchor id 0, fixed in uwb_config.c), the
# broker built up a persistent subscription under that shared client id -- and
# a persistent session survives reconnects, so the anchor kept inheriting a
# subscription it never asked for even after the client-id fix landed, showing
# up as a SLAVE board with nonzero blink_stats() received/rx_drop_evict, which
# should structurally be impossible (only a GATEWAY ever subscribes). A clean
# session on every connect is also just the right default for boards that
# reconnect on their own schedule and have no reason to want broker-side state
# to survive a disconnect.
CONFIG_MQTT_CLEAN_SESSION=y

# CloudAMQP (and most hosted brokers) only expose MQTT over TLS externally --
# port 8883 drops any client that doesn't do a TLS handshake. Peer
# verification is deliberately NOT required (TLS_PEER_VERIFY_NONE in
# net_uplink.c): no CA certificate is provisioned, matching how this broker
# is used from MQTTX today (SSL/TLS on, certificate verification off).
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# NOT OPTIONAL. Neither CONFIG_MQTT_LIB_TLS nor CONFIG_NET_SOCKETS_SOCKOPT_TLS
# picks a TLS protocol version or cipher suite on their own, and mbedTLS's
# generated config only turns on MBEDTLS_SSL_CLI_C/MBEDTLS_SSL_TLS_C (needed
# by Zephyr's own sockets_tls.c for mbedtls_ssl_get_session()/set_session())
# when a TLS proto version is selected -- and that alone still isn't enough:
# without a key exchange method and hash algorithm mbedTLS's own
# mbedtls_check_config.h fails the build ("no key exchange methods
# defined", "MBEDTLS_MD_C defined, but no hash algorithm"). This single
# ciphersuite selection pulls in everything needed: TLS 1.2,
# MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED, and the PSA SHA-256/GCM/AES/RSA
# algorithms -- a widely-supported suite for public TLS-terminating
# brokers (matches samples/net/secure_mqtt_sensor_actuator).
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# CloudAMQP's TLS front end is a shared, multi-tenant terminator -- it very
# likely routes by SNI. The hostname is already set on the TLS config in
# net_uplink.c; without this Kconfig the SNI extension is never actually
# placed in the ClientHello, so the hostname field is silently a no-op.
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

# NOT OPTIONAL. Default MBEDTLS_SSL_IN_CONTENT_LEN (1500 B) is too small for
# a real-world certificate chain: confirmed on target,
# mbedtls_ssl_fetch_input() failed ("requesting more data than fits")
# parsing CloudAMQP's ServerHello + Certificate message, which carries the
# full leaf + intermediate chain from a public CA and comfortably exceeds
# 1500 B. 4096 B leaves headroom for a multi-cert chain without the 16 KB
# some samples default to, which this project doesn't need.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# NOT OPTIONAL. CONFIG_MQTT_LIB only `select`s NET_SOCKETS, not NET_TCP --
# MQTT is TCP-only, so without this every mqtt_connect() fails at the first
# socket() call with -EPROTOTYPE (net_context_check() in net_context.c
# rejects SOCK_STREAM outright when NET_TCP is unset).
CONFIG_NET_TCP=y

# Zephyr's networking core defaults NET_IPV6=y even though this project only
# ever asked for IPv4/DHCPv4 (see spec/plan -- IPv6 is not in scope). Left on,
# IPv6 SLAAC + Router Advertisement RDNSS competes for the DNS resolver's one
# server slot (CONFIG_DNS_RESOLVER_MAX_SERVERS default is 1) against the
# DHCPv4-supplied IPv4 server: whichever source writes the slot last wins,
# and an IPv6-only address parked there breaks our AF_INET-only broker
# lookups even though the LAN's IPv4 DNS server works fine. Disabled since it
# was never needed.
CONFIG_NET_IPV6=n

# NOT OPTIONAL. The NET_TC_THREAD_TYPE choice defaults to its first entry,
# NET_TC_THREAD_COOPERATIVE at base priority 0 -- i.e. K_PRIO_COOP(0), the
# same priority main() is promoted to below. A cooperative thread cannot be
# preempted, so an RX burst would run to completion and can overrun the
# gateway's BEACON_ARM_MARGIN_UUS (5 ms). Forcing the traffic-class threads
# preemptible is what keeps the beacon protected rather than merely lucky.
CONFIG_NET_TC_THREAD_PREEMPTIVE=y

# The system workqueue carries dwt_isr(). br101 runs the DW3000 interrupt
# handler from here rather than from the GPIO callback (platform/dw3000_hw.c),
# which is what makes SPI legal inside cbRxOk at all -- and dwt_isr() is a large
# vendor function that reads CIA diagnostics over SPI.
#
# Measured with CONFIG_THREAD_ANALYZER on 2026-08-26, gateway under an
# `apos run`: sysworkq peaked at 948 of the default 1024 bytes, i.e. 92%, with
# 76 bytes spare. That is not a margin. Raised to 2048.
#
# Not tuning. This is the same failure class that had just cost three bench
# sessions: struct gw_core_ctx (2588 B) as an automatic on the 4096-byte main
# stack overflowed by 240 bytes the moment do_solve() ran, and because neither
# CONFIG_STACK_SENTINEL nor hardware stack protection is on in this image, it
# did so in total silence -- no log line, no fatal dump, and no report even
# from a k_timer ISR. A stack at 92% with the radio ISR on it is the next one
# of those waiting to happen.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_NET_LOG=y

# EUI-64 for the anchor survey: apos_node keys enumeration and the gateway's
# coordinate table on a per-board id, and the stagger that keeps enumeration
# replies from colliding is derived from it. hwinfo reads the ESP32-S3 eFuse MAC.
CONFIG_HWINFO=y

# Survey session ids (apos_gw.c) come from sys_rand32_get(). A predictable id
# would let a stale reply from an abandoned run be accepted by a new one, which
# is exactly the failure the session field exists to prevent — so this is the
# hardware RNG, not a counter and not CONFIG_TEST_RANDOM_GENERATOR. The
# production image pulls the random subsystem in via WiFi anyway; the
# calibration image (cal.conf turns networking off) does not, and fails to link
# without this.
CONFIG_ENTROPY_GENERATOR=y
